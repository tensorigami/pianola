name: book

on:
  push:
    branches: [main]
    paths: [book/**, .github/workflows/book.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook + preprocessors
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          curl -sSL https://github.com/lzanini/mdbook-katex/releases/download/0.10.0-alpha-binaries/mdbook-katex-v0.10.0-alpha-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mdbook-tikz + tectonic + pdf2svg
        run: |
          sudo apt-get update && sudo apt-get install -y pdf2svg
          cargo install mdbook-tikz
          curl -sSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"

      - uses: actions/configure-pages@v5

      - name: Build
        run: mdbook build book

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
