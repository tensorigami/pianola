[project]
name = "pianola"
version = "0.1.0"
description = "Interactive textbook + analysis tool for open-weight language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "safetensors",
    "tokenizers",
    "jaxtyping",
    "beartype",
    "einops",
    "jinja2",
    "huggingface-hub",
    "typer",
    "jax",
    "jaxlib",
    "tomli-w>=1.2.0",
    "orjson>=3.11.7",
    "catform==0.2.0",
    "ipython>=8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "transformers",
    "pytest",
    "pyright",
    "ruff",
    "accelerate>=1.13.0",
    "openai>=2.38.0",
]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pianola"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"models/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = "warning"
exclude = []
